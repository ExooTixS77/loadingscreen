<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Chargement</title>
<style>
  :root { --accent: #ff9f1c; --accent2: #ffd166; --text: #f5f5f5; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #07070b; color: var(--text); font-family: "Segoe UI", Arial, sans-serif; }

  /* ===== Fond ===== */
  #bg { position: fixed; inset: 0; }
  .slide { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 2.2s ease; }
  .slide.active { opacity: 1; animation: kb 22s ease-in-out forwards; }
  @keyframes kb { from { transform: scale(1) translate(0,0); } to { transform: scale(1.14) translate(-1.5%, -1%); } }
  #vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.05) 25%, rgba(0,0,0,.8) 100%),
                linear-gradient(to top, rgba(0,0,0,.9) 0%, transparent 40%),
                linear-gradient(to bottom, rgba(0,0,0,.55) 0%, transparent 25%); }
  #scan { position: fixed; inset: 0; pointer-events: none; opacity: .07;
    background: repeating-linear-gradient(0deg, #000 0, #000 1px, transparent 1px, transparent 3px); }
  #fx { position: fixed; inset: 0; pointer-events: none; }

  /* ===== Layout ===== */
  #ui { position: fixed; inset: 0; padding: 4vh 4vw; display: grid; grid-template-rows: auto 1fr auto; gap: 2vh; }

  /* Header */
  #head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
  #brand { display: flex; align-items: center; gap: 24px; animation: dropIn 1s ease both; }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-25px); } to { opacity: 1; transform: none; } }

  /* Emblème rond animé (logo ou initiales) */
  #emblem { position: relative; flex: none; width: clamp(80px, 8.5vw, 128px); height: clamp(80px, 8.5vw, 128px); display: grid; place-items: center; }
  #emblem::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(var(--accent), transparent 35%, var(--accent2) 55%, transparent 80%, var(--accent));
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
    animation: spin 6s linear infinite; }
  #emblem::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: rgba(0,0,0,.55); backdrop-filter: blur(8px);
    box-shadow: 0 0 35px rgba(255,159,28,.35), inset 0 0 18px rgba(255,255,255,.08); animation: pulse 3s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 55px rgba(255,159,28,.6), inset 0 0 18px rgba(255,255,255,.12); } }
  #emblemInner { position: relative; z-index: 1; font-size: clamp(28px, 3.2vw, 48px); font-weight: 800; letter-spacing: 2px; color: var(--accent2); text-shadow: 0 0 18px var(--accent); }
  #emblemInner img { width: clamp(46px, 5vw, 76px); height: clamp(46px, 5vw, 76px); object-fit: contain; border-radius: 50%; display: block; }

  #welcome { display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: 5px; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  #welcome i { width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 10px #3ddc84; animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  #brand h1 { margin-top: 4px; font-size: clamp(30px, 4.4vw, 66px); font-weight: 800; letter-spacing: 2px; text-transform: uppercase; line-height: 1.05; color: #fff;
    text-shadow: 0 0 32px rgba(255,159,28,.45), 0 4px 18px rgba(0,0,0,.75); }
  #underline { height: 3px; width: 0; margin: 10px 0 8px; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2), transparent); animation: grow 1.4s ease forwards .5s; }
  @keyframes grow { to { width: 100%; } }
  #brand p { font-size: clamp(13px, 1.4vw, 19px); opacity: .85; letter-spacing: 1px; }

  .infos { margin-top: 16px; display: flex; flex-wrap: wrap; row-gap: 10px; }
  .info { padding: 0 20px; border-left: 2px solid rgba(255,255,255,.2); }
  .info:first-child { padding-left: 0; border-left: none; }
  .info small { display: block; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; opacity: .6; }
  .info b { font-size: 18px; font-weight: 700; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.6); }

  /* Lecteur musique */
  #player { min-width: 270px; padding: 14px 16px; border-radius: 16px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(10px); }
  #trackRow { display: flex; align-items: center; gap: 12px; }
  #disc { width: 38px; height: 38px; border-radius: 50%; flex: none; background: conic-gradient(var(--accent), #222, var(--accent2), #222, var(--accent)); box-shadow: inset 0 0 0 11px #111; animation: spin 4s linear infinite; }
  #disc.paused { animation-play-state: paused; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #trackName { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
  #trackSub { font-size: 11px; opacity: .6; }
  canvas#viz { display: block; width: 100%; height: 38px; margin: 10px 0 6px; }
  #ctrl { display: flex; align-items: center; gap: 8px; }
  #ctrl button { background: none; border: none; color: var(--text); font-size: 18px; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
  #ctrl button:hover { background: rgba(255,255,255,.12); }
  #ctrl input { flex: 1; accent-color: var(--accent); }

  /* Milieu */
  #mid { display: flex; align-items: center; }
  .panel { width: min(340px, 30vw); padding: 16px 18px; border-radius: 16px; background: rgba(0,0,0,.42); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(10px); animation: slideIn 1s ease both .4s; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: none; } }
  .panel h3 { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
  .panel ul { list-style: none; font-size: 14px; line-height: 1.9; }
  .panel li::before { content: "▸ "; color: var(--accent); }
  .links { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
  .links span { font-size: 12px; padding: 5px 12px; border-radius: 14px; background: rgba(255,255,255,.1); }
  .links span b { color: var(--accent2); }

  /* Bas */
  #foot { display: flex; flex-direction: column; gap: 10px; }
  #tip { font-size: clamp(14px, 1.5vw, 20px); min-height: 1.5em; opacity: 0; transition: opacity .7s; text-shadow: 0 2px 10px #000; }
  #tip.show { opacity: .95; }
  #tip::before { content: "💡 "; }
  #stat { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; font-size: 13px; opacity: .85; }
  #file { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pct { font-size: 26px; font-weight: 800; color: var(--accent); opacity: 1; }
  .bar { height: 12px; border-radius: 8px; background: rgba(255,255,255,.14); overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.08); }
  #progress { height: 100%; width: 0; border-radius: 8px; position: relative; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .5s ease; box-shadow: 0 0 18px var(--accent); }
  #progress::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent); animation: shine 1.5s linear infinite; }
  @keyframes shine { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  #meta { display: flex; justify-content: space-between; font-size: 12px; opacity: .6; }

  #fade { position: fixed; inset: 0; background: #000; animation: fadeOut 1.4s ease forwards; pointer-events: none; }
  @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
</style>
</head>
<body>

<div id="bg"></div>
<div id="vignette"></div>
<div id="scan"></div>
<canvas id="fx"></canvas>

<div id="ui">
  <div id="head">
    <div id="brand">
      <div id="emblem"><div id="emblemInner">GM</div></div>
      <div id="titleBox">
        <div id="welcome"><i></i>Bienvenue sur</div>
        <h1 id="serverName">Chargement</h1>
        <div id="underline"></div>
        <p id="subtitle"></p>
        <div class="infos">
          <div class="info"><small>Map</small><b id="map">—</b></div>
          <div class="info"><small>Mode de jeu</small><b id="gamemode">—</b></div>
          <div class="info"><small>Slots</small><b id="slots">—</b></div>
          <div class="info"><small>Heure</small><b id="clock">--:--</b></div>
        </div>
      </div>
    </div>

    <div id="player">
      <div id="trackRow">
        <div id="disc"></div>
        <div><div id="trackName">—</div><div id="trackSub">Musique</div></div>
      </div>
      <canvas id="viz" width="270" height="38"></canvas>
      <div id="ctrl">
        <button id="prev" title="Précédent">⏮</button>
        <button id="play" title="Lecture / Pause">⏸</button>
        <button id="next" title="Suivant">⏭</button>
        <button id="mute" title="Couper le son">🔊</button>
        <input id="vol" type="range" min="0" max="100">
      </div>
    </div>
  </div>

  <div id="mid">
    <div class="panel" id="rulesPanel">
      <h3>Règles</h3>
      <ul id="rules"></ul>
      <div class="links" id="links"></div>
    </div>
  </div>

  <div id="foot">
    <div id="tip"></div>
    <div id="stat"><span id="file">Connexion au serveur...</span><span id="pct">0%</span></div>
    <div class="bar"><div id="progress"></div></div>
    <div id="meta"><span id="count">Fichiers : —</span><span id="eta"></span></div>
  </div>
</div>

<audio id="audio" preload="auto"></audio>
<div id="fade"></div>

<script>
/* =====================================================
   CONFIGURATION : modifie uniquement cette partie
   ===================================================== */
var CONFIG = {
  serverName: null,                       // null = nom du serveur automatique
  subtitle: "Ton aventure commence dans un instant...",
  logo: null,                             // ex: "logo.png" (rond/carré), sinon les initiales du serveur s'affichent

  images: ["background.jpg"],             // 1 image = zoom animé / plusieurs = diaporama
  slideDuration: 10000,

  music: [                                // 1 ou plusieurs musiques
    { src: "music.mp3", title: "Ma musique", artist: "Mon serveur" }
  ],
  volume: 0.4,
  shuffle: false,

  rules: [
    "Respecte tous les joueurs",
    "Pas de cheat ni d'exploit",
    "Pas de RDM / propkill",
    "Écoute le staff"
  ],
  links: [                                // laisse [] pour ne rien afficher
    { label: "Discord", value: "discord.gg/tonlien" },
    { label: "Site", value: "tonsite.com" }
  ],
  tips: [
    "Tape !help dans le chat pour voir les commandes.",
    "Appuie sur C pour ouvrir le menu contextuel.",
    "Rejoins notre Discord pour suivre les actus.",
    "Un souci ? Contacte un membre du staff."
  ],
  tipDuration: 6000,

  accent: "#ff9f1c",
  accent2: "#ffd166",
  particles: true
};

/* =====================================================
   CODE : pas besoin de modifier en dessous
   ===================================================== */
var $ = function (id) { return document.getElementById(id); };
document.documentElement.style.setProperty("--accent", CONFIG.accent);
document.documentElement.style.setProperty("--accent2", CONFIG.accent2);

/* ---------- Fond ---------- */
(function () {
  var bg = $("bg"), slides = [], i = 0;
  CONFIG.images.forEach(function (src) {
    var d = document.createElement("div"); d.className = "slide";
    d.style.backgroundImage = 'url("' + src + '")'; bg.appendChild(d); slides.push(d);
  });
  if (!slides.length) return;
  slides[0].classList.add("active");
  if (slides.length > 1) setInterval(function () {
    slides[i].classList.remove("active"); i = (i + 1) % slides.length;
    slides[i].style.animation = "none"; void slides[i].offsetWidth; slides[i].style.animation = "";
    slides[i].classList.add("active");
  }, CONFIG.slideDuration);
})();

/* ---------- Particules ---------- */
(function () {
  if (!CONFIG.particles) return;
  var c = $("fx"), x = c.getContext("2d"), P = [], W, H;
  function size() { W = c.width = innerWidth; H = c.height = innerHeight; }
  size(); addEventListener("resize", size);
  for (var n = 0; n < 70; n++) P.push({ x: Math.random() * 2000, y: Math.random() * 1200, r: Math.random() * 2 + .5, s: Math.random() * .5 + .15, d: Math.random() * 1 - .5, a: Math.random() * .6 + .2 });
  (function draw() {
    x.clearRect(0, 0, W, H);
    P.forEach(function (p) {
      p.y -= p.s; p.x += p.d * .4;
      if (p.y < -5) { p.y = H + 5; p.x = Math.random() * W; }
      x.beginPath(); x.arc(p.x % W, p.y, p.r, 0, 6.283);
      x.fillStyle = "rgba(255,220,150," + p.a + ")"; x.shadowBlur = 8; x.shadowColor = CONFIG.accent; x.fill();
    });
    requestAnimationFrame(draw);
  })();
})();

/* ---------- Règles, liens, astuces, horloge ---------- */
(function () {
  var ul = $("rules");
  CONFIG.rules.forEach(function (r) { var li = document.createElement("li"); li.textContent = r; ul.appendChild(li); });
  CONFIG.links.forEach(function (l) { var s = document.createElement("span"); s.innerHTML = l.label + " : <b></b>"; s.querySelector("b").textContent = l.value; $("links").appendChild(s); });
  if (!CONFIG.rules.length && !CONFIG.links.length) $("rulesPanel").style.display = "none";

  var tip = $("tip"), t = 0;
  function showTip() {
    if (!CONFIG.tips.length) return;
    tip.classList.remove("show");
    setTimeout(function () { tip.textContent = CONFIG.tips[t]; tip.classList.add("show"); t = (t + 1) % CONFIG.tips.length; }, 700);
  }
  showTip(); setInterval(showTip, CONFIG.tipDuration);

  function clock() { var d = new Date(); $("clock").textContent = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }
  clock(); setInterval(clock, 15000);
})();

/* ---------- Musique + visualiseur ---------- */
(function () {
  var audio = $("audio"), list = CONFIG.music.slice(), idx = 0, muted = false;
  if (!list.length) { $("player").style.display = "none"; return; }
  if (CONFIG.shuffle) list.sort(function () { return Math.random() - .5; });
  audio.volume = CONFIG.volume; $("vol").value = Math.round(CONFIG.volume * 100);
  audio.loop = list.length === 1;

  function load(n) {
    idx = (n + list.length) % list.length;
    var m = list[idx]; audio.src = m.src;
    $("trackName").textContent = m.title || m.src; $("trackSub").textContent = m.artist || "Musique";
  }
  function play() { audio.play().catch(function () { setPlayIcon(false); }); }
  function setPlayIcon(p) { $("play").textContent = p ? "⏸" : "▶"; $("disc").classList.toggle("paused", !p); }
  audio.addEventListener("play", function () { setPlayIcon(true); });
  audio.addEventListener("pause", function () { setPlayIcon(false); });
  audio.addEventListener("ended", function () { load(idx + 1); play(); });
  audio.addEventListener("error", function () { if (list.length > 1) { load(idx + 1); play(); } });

  $("play").onclick = function () { audio.paused ? play() : audio.pause(); };
  $("prev").onclick = function () { load(idx - 1); play(); };
  $("next").onclick = function () { load(idx + 1); play(); };
  $("mute").onclick = function () { muted = !muted; audio.muted = muted; $("mute").textContent = muted ? "🔇" : "🔊"; };
  $("vol").oninput = function () { audio.volume = this.value / 100; };
  document.addEventListener("click", function () { if (audio.paused && !muted && audio.currentTime === 0) play(); }, { once: true });

  load(0); play();

  /* Visualiseur : réel si possible (même origine), sinon animation simulée */
  var cv = $("viz"), cx = cv.getContext("2d"), an = null, data = null, N = 32;
  var sameOrigin = list.every(function (m) { return !/^https?:\/\//i.test(m.src) || m.src.indexOf(location.origin) === 0; });
  function initAudioCtx() {
    if (an || !sameOrigin) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext, ac = new AC();
      var src = ac.createMediaElementSource(audio); an = ac.createAnalyser(); an.fftSize = 128;
      src.connect(an); an.connect(ac.destination); data = new Uint8Array(an.frequencyBinCount);
    } catch (e) { an = null; }
  }
  audio.addEventListener("play", initAudioCtx);
  var fake = []; for (var k = 0; k < N; k++) fake.push(Math.random());
  (function draw() {
    cx.clearRect(0, 0, cv.width, cv.height);
    var w = cv.width / N, g = cx.createLinearGradient(0, cv.height, 0, 0);
    g.addColorStop(0, CONFIG.accent); g.addColorStop(1, CONFIG.accent2); cx.fillStyle = g;
    if (an) an.getByteFrequencyData(data);
    for (var i = 0; i < N; i++) {
      var v;
      if (an) v = data[i] / 255;
      else if (!audio.paused && !muted) { fake[i] += (Math.random() - .5) * .35; fake[i] = Math.max(.08, Math.min(1, fake[i])); v = fake[i]; }
      else v = .06;
      var h = Math.max(2, v * cv.height);
      cx.fillRect(i * w + 1, cv.height - h, w - 3, h);
    }
    requestAnimationFrame(draw);
  })();
})();

/* ---------- Callbacks appelés par Garry's Mod ---------- */
var total = 0, needed = 0, startT = Date.now();
function refresh() {
  var done = total - needed, pct = total > 0 ? Math.max(0, Math.min(100, Math.round(done / total * 100))) : 0;
  $("progress").style.width = pct + "%"; $("pct").textContent = pct + "%";
  $("count").textContent = total > 0 ? "Fichiers : " + done + " / " + total : "Fichiers : —";
  if (done > 0 && needed > 0) {
    var s = Math.round(((Date.now() - startT) / done) * needed / 1000);
    $("eta").textContent = "Temps restant estimé : " + (s > 60 ? Math.round(s / 60) + " min" : s + " s");
  } else $("eta").textContent = "";
}
function setEmblem(name) {
  var box = $("emblemInner");
  if (CONFIG.logo) { box.innerHTML = ""; var im = document.createElement("img"); im.src = CONFIG.logo; box.appendChild(im); return; }
  var w = String(name).replace(/[^A-Za-z0-9À-ÿ ]/g, " ").trim().split(/\s+/).filter(Boolean);
  box.textContent = ((w[0] || "G")[0] + (w[1] ? w[1][0] : (w[0] && w[0][1]) || "")).toUpperCase();
}
function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
  setEmblem(CONFIG.serverName || servername);
  $("serverName").textContent = CONFIG.serverName || servername;
  $("subtitle").textContent = CONFIG.subtitle;
  $("map").textContent = mapname; $("gamemode").textContent = gamemode; $("slots").textContent = maxplayers;
  document.title = servername;
}
function SetFilesTotal(t)    { total = t;  refresh(); }
function SetFilesNeeded(n)   { needed = n; refresh(); }
function DownloadingFile(f)  { $("file").textContent = "Téléchargement : " + f.split("/").pop(); }
function SetStatusChanged(s) { $("file").textContent = s; }

/* ---------- Démo : ouvre index.html?demo dans un navigateur ---------- */
if (location.search.indexOf("demo") !== -1) {
  GameDetails("Mon Serveur GMod", "", "gm_construct", 32, "0", "sandbox");
  SetFilesTotal(150); var n = 150;
  var tm = setInterval(function () {
    n -= 2; SetFilesNeeded(Math.max(n, 0));
    DownloadingFile("materials/exemple/fichier" + (150 - n) + ".vmt");
    if (n <= 0) { clearInterval(tm); SetStatusChanged("Envoi des infos client..."); }
  }, 300);
}
</script>
</body>
</html>
